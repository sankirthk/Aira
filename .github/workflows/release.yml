name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish, for example v1.0.0-beta.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Verify tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_DEFAULT_BRANCH="$(gh api "repos/${{ github.repository }}" --jq '.default_branch')"
          git fetch origin "$SOURCE_DEFAULT_BRANCH" --depth=1
          git merge-base --is-ancestor "$(git rev-parse HEAD)" "origin/$SOURCE_DEFAULT_BRANCH"


  package-and-notarize:
    name: Package And Notarize
    runs-on: macos-latest
    timeout-minutes: 60
    needs: validate
    outputs:
      version: ${{ steps.package.outputs.version }}
      build: ${{ steps.package.outputs.build }}
      tag: ${{ steps.package.outputs.tag }}
      release_date: ${{ steps.package.outputs.release_date }}
      dmg_name: ${{ steps.package.outputs.dmg_name }}
      zip_name: ${{ steps.package.outputs.zip_name }}
      appcast_name: ${{ steps.package.outputs.appcast_name }}
      appcast_url: ${{ steps.package.outputs.appcast_url }}
      release_notes_url: ${{ steps.package.outputs.release_notes_url }}
      is_prerelease: ${{ steps.package.outputs.is_prerelease }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Build, sign, notarize, and package release artifacts
        id: package
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          RELEASE_REPOSITORY: sankirthk/aira-releases
          APPLE_SIGNING_CERT_BASE64: ${{ secrets.APPLE_SIGNING_CERT_BASE64 }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_FEED_URL: ${{ secrets.SPARKLE_FEED_URL }}
        run: bash scripts/release/build_release_dmg.sh

      - name: Upload packaged release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ steps.package.outputs.tag }}
          path: |
            ${{ steps.package.outputs.dmg_path }}
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.appcast_path }}
          if-no-files-found: error

  publish-public-release:
    name: Publish Public Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - package-and-notarize
    outputs:
      release_url: ${{ steps.publish.outputs.release_url }}
      dmg_url: ${{ steps.publish.outputs.dmg_url }}
      zip_url: ${{ steps.publish.outputs.zip_url }}
      release_notes_url: ${{ steps.publish.outputs.release_notes_url }}
    steps:
      - name: Download packaged release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ needs.package-and-notarize.outputs.tag }}
          path: build/public-release

      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.package-and-notarize.outputs.tag }}
          path: aira-source

      - name: Mint token for aira-releases
        id: releases-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AIRA_RELEASE_APP_ID }}
          private-key: ${{ secrets.AIRA_RELEASE_APP_PRIVATE_KEY }}
          owner: sankirthk
          repositories: aira-releases

      - name: Create or update public release
        id: publish
        env:
          GH_TOKEN: ${{ steps.releases-token.outputs.token }}
          RELEASE_REPO: sankirthk/aira-releases
          TAG: ${{ needs.package-and-notarize.outputs.tag }}
          VERSION: ${{ needs.package-and-notarize.outputs.version }}
          IS_PRERELEASE: ${{ needs.package-and-notarize.outputs.is_prerelease }}
          DMG_NAME: ${{ needs.package-and-notarize.outputs.dmg_name }}
          ZIP_NAME: ${{ needs.package-and-notarize.outputs.zip_name }}
        run: |
          RELEASE_LABEL="${TAG#v}"
          RELEASE_NOTES_PATH="$GITHUB_WORKSPACE/aira-source/docs/releases/${RELEASE_LABEL}.md"
          DMG_PATH="build/public-release/$DMG_NAME"
          ZIP_PATH="build/public-release/$ZIP_NAME"
          TARGET_BRANCH="$(gh api "repos/$RELEASE_REPO" --jq '.default_branch')"
          RELEASE_ARGS=()

          if [[ ! -f "$RELEASE_NOTES_PATH" ]]; then
            echo "error: release notes not found at $RELEASE_NOTES_PATH" >&2
            exit 1
          fi

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$RELEASE_REPO" \
              --title "Aira $RELEASE_LABEL" \
              --notes-file "$RELEASE_NOTES_PATH" \
              "${RELEASE_ARGS[@]}"
          else
            gh release create "$TAG" \
              --repo "$RELEASE_REPO" \
              --target "$TARGET_BRANCH" \
              --title "Aira $RELEASE_LABEL" \
              --notes-file "$RELEASE_NOTES_PATH" \
              "${RELEASE_ARGS[@]}"
          fi

          gh release upload "$TAG" "$DMG_PATH" "$ZIP_PATH" \
            --repo "$RELEASE_REPO" \
            --clobber

          RELEASE_URL="$(gh api "repos/$RELEASE_REPO/releases/tags/$TAG" --jq '.html_url')"
          DMG_URL="$(gh api "repos/$RELEASE_REPO/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$DMG_NAME\") | .browser_download_url")"
          ZIP_URL="$(gh api "repos/$RELEASE_REPO/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$ZIP_NAME\") | .browser_download_url")"

          {
            echo "release_url=$RELEASE_URL"
            echo "dmg_url=$DMG_URL"
            echo "zip_url=$ZIP_URL"
            echo "release_notes_url=$RELEASE_URL"
          } >> "$GITHUB_OUTPUT"

  publish-sparkle-appcast:
    name: Publish Sparkle Appcast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - package-and-notarize
      - publish-public-release
    steps:
      - name: Download packaged release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ needs.package-and-notarize.outputs.tag }}
          path: build/public-release

      - name: Mint token for aira-releases
        id: releases-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AIRA_RELEASE_APP_ID }}
          private-key: ${{ secrets.AIRA_RELEASE_APP_PRIVATE_KEY }}
          owner: sankirthk
          repositories: aira-releases

      - name: Check out aira-releases
        uses: actions/checkout@v4
        with:
          repository: sankirthk/aira-releases
          token: ${{ steps.releases-token.outputs.token }}
          path: aira-releases

      - name: Commit and push appcast
        working-directory: aira-releases
        env:
          APPCAST_NAME: ${{ needs.package-and-notarize.outputs.appcast_name }}
          TAG: ${{ needs.package-and-notarize.outputs.tag }}
        run: |
          TARGET_BRANCH="$(git branch --show-current)"
          cp "../build/public-release/$APPCAST_NAME" "./$APPCAST_NAME"
          git add "$APPCAST_NAME"

          if git diff --cached --quiet -- "$APPCAST_NAME"; then
            exit 0
          fi

          git config user.name "aira-release-bot[bot]"
          git config user.email "aira-release-bot[bot]@users.noreply.github.com"
          git commit -m "Update Sparkle appcast for $TAG"
          git push origin "HEAD:$TARGET_BRANCH"

  update-website-metadata:
    name: Update Website Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - package-and-notarize
      - publish-public-release
      - publish-sparkle-appcast
    steps:
      - name: Mint token for aira-site
        id: site-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AIRA_RELEASE_APP_ID }}
          private-key: ${{ secrets.AIRA_RELEASE_APP_PRIVATE_KEY }}
          owner: sankirthk
          repositories: aira-site

      - name: Check out Aira source (for release template)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.package-and-notarize.outputs.tag }}
          path: aira-source

      - name: Check out aira-site
        uses: actions/checkout@v4
        with:
          repository: sankirthk/aira-site
          token: ${{ steps.site-token.outputs.token }}
          path: aira-site

      - name: Rewrite release metadata
        env:
          TAG: ${{ needs.package-and-notarize.outputs.tag }}
          RELEASE_DATE: ${{ needs.package-and-notarize.outputs.release_date }}
          DMG_URL: ${{ needs.publish-public-release.outputs.dmg_url }}
          RELEASE_NOTES_URL: ${{ needs.publish-public-release.outputs.release_notes_url }}
        run: |
          TEMPLATE_PATH="$GITHUB_WORKSPACE/aira-source/scripts/release/release_metadata.ts.template"
          RELEASE_NOTES_PATH="$GITHUB_WORKSPACE/aira-source/docs/releases/${TAG#v}.md"

          if [[ ! -f "$TEMPLATE_PATH" ]]; then
            echo "error: release metadata template not found at $TEMPLATE_PATH" >&2
            exit 1
          fi

          if [[ ! -f "$RELEASE_NOTES_PATH" ]]; then
            echo "error: release notes not found at $RELEASE_NOTES_PATH" >&2
            exit 1
          fi

          node "$GITHUB_WORKSPACE/aira-source/scripts/release/render_site_release_metadata.mjs" \
            --template "$TEMPLATE_PATH" \
            --notes "$RELEASE_NOTES_PATH" \
            --existing aira-site/src/content/release.ts \
            --output aira-site/src/content/release.ts \
            --changelog-file aira-site/src/pages/ChangelogPage.tsx \
            --tag "$TAG" \
            --release-date "$RELEASE_DATE" \
            --dmg-url "$DMG_URL" \
            --release-notes-url "$RELEASE_NOTES_URL"

      - name: Commit and push site metadata
        working-directory: aira-site
        env:
          TAG: ${{ needs.package-and-notarize.outputs.tag }}
        run: |
          TARGET_BRANCH="$(git branch --show-current)"
          git add src/content/release.ts src/pages/ChangelogPage.tsx

          if git diff --cached --quiet -- src/content/release.ts src/pages/ChangelogPage.tsx; then
            exit 0
          fi

          git config user.name "aira-release-bot[bot]"
          git config user.email "aira-release-bot[bot]@users.noreply.github.com"
          git commit -m "Update release metadata for $TAG"
          git push origin "HEAD:$TARGET_BRANCH"

  post-publish-summary:
    name: Post-Publish Summary
    runs-on: ubuntu-latest
    needs:
      - package-and-notarize
      - publish-public-release
      - publish-sparkle-appcast
      - update-website-metadata
    steps:
      - name: Print release summary
        run: |
          echo "Public release: ${{ needs.publish-public-release.outputs.release_url }}"
          echo "DMG asset:       ${{ needs.publish-public-release.outputs.dmg_url }}"
          echo "ZIP asset:       ${{ needs.publish-public-release.outputs.zip_url }}"
          echo "Appcast URL:     ${{ needs.package-and-notarize.outputs.appcast_url }}"
          echo "Site URL:        https://sankirthk.github.io/aira-site/"
          echo "Manual checks:"
          echo "  - Install the DMG on a clean Mac."
          echo "  - Confirm the microphone permission prompt path."
          echo "  - Confirm Voice-Sync launches correctly."
          echo "  - Confirm an installed build discovers the new Sparkle feed entry."
          echo "  - Confirm the site version and download button match the public release."
